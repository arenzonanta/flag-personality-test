            'dark_white': { name:'The Quiet Observer', emoji:'⚪⚫', color:'#b0a0c0', desc:'You see everything, say little.' },
            'red_white': { name:'The Fragile Volcano', emoji:'🔴⚪', color:'#ff9999', desc:'Emotional rollercoaster — you feel everything intensely.' },
            'white_red': { name:'The Fragile Volcano', emoji:'🔴⚪', color:'#ff9999', desc:'Emotional rollercoaster.' },
            'dark_dark': { name:'The Shadow Architect', emoji:'⚫', color:'#9966cc', desc:'Master strategist. You operate on a different level.' },
            'red_red': { name:'The Unfiltered Fire', emoji:'🔴', color:'#ff4d6d', desc:'No filter, no apologies. Your authenticity is both gift and curse.' },
            'white_white': { name:'The Ghost', emoji:'⚪', color:'#e0e0e0', desc:'You blend in to survive. But who are you really?' }
        };

        var explanations = {
            red: {
                title: '🔴 RED FLAG',
                color: '#ff4d6d',
                low: 'Your Red Flag is low. You rarely explode and can control your emotions well. People see you as composed and level-headed.',
                mid: 'Your Red Flag is moderate. You have an impulsive side that emerges when cornered or provoked. You\'re passionate but can sometimes overwhelm others.',
                high: 'Your Red Flag is high! You\'re reactive and emotionally expressive. People may find you intense, but deep down you just want to be heard and understood.'
            },
            green: {
                title: '🟢 GREEN FLAG',
                color: '#4ade80',
                low: 'Your Green Flag is low. You might need to work on communication and empathy. Opening up more could strengthen your relationships.',
                mid: 'Your Green Flag is decent. You can be a good listener and show empathy, but there\'s still room to grow in expressing yourself healthily.',
                high: 'Your Green Flag is high! You have strong emotional intelligence. People feel safe around you because you listen without judgment and communicate with kindness.'
            },
            white: {
                title: '⚪ WHITE FLAG',
                color: '#e2e8f0',
                low: 'Your White Flag is low. You don\'t easily sacrifice yourself — and that\'s actually healthy! You know your worth and set boundaries.',
                mid: 'Your White Flag is moderate. You sometimes concede too easily to keep the peace, but you still stand up for yourself when it really matters.',
                high: 'Your White Flag is high. You often put yourself last to make others comfortable. Remember: your needs matter too. Learning to say no is a form of self-respect.'
            },
            dark: {
                title: '⚫ DARK FLAG',
                color: '#c084fc',
                low: 'Your Dark Flag is low. You\'re open and straightforward — you don\'t play games or operate behind the scenes. People appreciate your honesty.',
                mid: 'Your Dark Flag is moderate. You have a strategic side that emerges when needed. You\'re observant and sometimes keep your cards close to your chest.',
                high: 'Your Dark Flag is high. You\'re highly observant and calculating. You see patterns others miss, but being more transparent could deepen your connections.'
            }
        };

        var quizArea = document.getElementById('quizArea');
        var midAd = document.getElementById('midAd');
        var bottomAd = document.getElementById('bottomAd');
        var currentIdx = 0;
        var scores = { r:0, g:0, w:0, d:0 };

        function showMidAd() {
            if (midAd.classList.contains('hidden')) {
                midAd.classList.remove('hidden');
                try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch(e) {}
            }
        }

        function showBottomAd() {
            if (bottomAd.classList.contains('hidden')) {
                bottomAd.classList.remove('hidden');
                try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch(e) {}
            }
        }

        function getExplanation(flag, pct) {
            if (pct >= 35) return explanations[flag].high;
            if (pct >= 18) return explanations[flag].mid;
            return explanations[flag].low;
        }

        function renderQuestion() {
            if (currentIdx >= questions.length) { showLoading(); return; }
            if (currentIdx === 15) showMidAd();

            var q = questions[currentIdx];
            var progress = (currentIdx / questions.length) * 100;

            var html = '<div class="card"><h1>🚩 THE ULTIMATE FLAG TEST</h1>';
            html += '<div class="subtitle">✨ 30 unique questions ✨</div>';
            html += '<div class="progress-row"><div class="progress-bg"><div class="progress-fill" style="width:'+progress+'%;"></div></div>';
            html += '<span class="step-text">'+(currentIdx+1)+'/30</span></div>';
            html += '<div class="question-box"><div class="question-text">'+q.q+'</div><div class="options">';
            for(var i=0; i<q.opts.length; i++) {
                html += '<div class="option" data-s=\''+JSON.stringify(q.opts[i].s)+'\'><span class="option-num">'+String.fromCharCode(65+i)+'</span><span>'+q.opts[i].t+'</span></div>';
            }
            html += '</div></div></div>';
            quizArea.innerHTML = html;

            var opts = document.querySelectorAll('.option');
            for(var j=0; j<opts.length; j++) {
                opts[j].addEventListener('click', function() {
                    var s = JSON.parse(this.getAttribute('data-s'));
                    scores.r += s.r; scores.g += s.g; scores.w += s.w; scores.d += s.d;
                    currentIdx++;
                    renderQuestion();
                });
            }
        }

        function showLoading() {
            var html = '<div class="card loading-screen"><div class="loading-spinner"></div><div class="loading-steps">';
            html += '<div class="loading-step">🔍 Analyzing your answers...</div>';
            html += '<div class="loading-step">🧠 Detecting emotional patterns...</div>';
            html += '<div class="loading-step">🕵️ Comparing personality traits...</div>';
            html += '<div class="loading-step">🌪️ Finding hidden tendencies...</div>';
            html += '<div class="loading-step">✅ Done. Your true colors revealed.</div></div></div>';
            quizArea.innerHTML = html;
            setTimeout(renderResult, 3200);
        }

        function renderResult() {
            showBottomAd();
            var sum = scores.r+scores.g+scores.w+scores.d || 1;
            var p = { r:Math.round(scores.r/sum*100), g:Math.round(scores.g/sum*100), w:Math.round(scores.w/sum*100), d:Math.round(scores.d/sum*100) };
            var sorted = [{k:'r',v:p.r},{k:'g',v:p.g},{k:'w',v:p.w},{k:'d',v:p.d}].sort(function(a,b){return b.v-a.v});
            var primary = sorted[0].k, secondary = sorted[1].v>=20 ? sorted[1].k : primary;
            var combo = combos[primary+'_'+secondary] || { name:'Complex Flag', emoji:'🏴', color:'#ccc', desc:'You defy simple categories.' };
            var variance = Math.max(p.r,p.g,p.w,p.d) - Math.min(p.r,p.g,p.w,p.d);
            var confidence = Math.min(98, Math.max(55, 100-variance));

            var html = '<div class="card result">';
            html += '<div class="big-emoji">'+combo.emoji+'</div>';
            html += '<div class="result-title" style="color:'+combo.color+';">'+combo.name+'</div>';
            html += '<div class="result-subtitle">'+combo.desc+'</div>';
            html += '<div class="confidence-badge">Confidence: '+confidence+'%</div>';
            html += '<div class="percent-grid">';
            html += '<div class="percent-item"><span style="color:#ff8c94;">🔴 Red</span><br><span class="percent-num">'+p.r+'%</span></div>';
            html += '<div class="percent-item"><span style="color:#7fbf7f;">🟢 Green</span><br><span class="percent-num">'+p.g+'%</span></div>';
            html += '<div class="percent-item"><span style="color:#e0e0e0;">⚪ White</span><br><span class="percent-num">'+p.w+'%</span></div>';
            html += '<div class="percent-item"><span style="color:#c792ea;">⚫ Dark</span><br><span class="percent-num">'+p.d+'%</span></div></div>';
            html += '<div class="analysis-section"><h3 style="font-size:0.9rem;margin-bottom:0.5rem;">📋 Why you got each flag:</h3>';
            
            var flags = [{key:'red',pct:p.r},{key:'green',pct:p.g},{key:'white',pct:p.w},{key:'dark',pct:p.d}];
            for(var i=0; i<flags.length; i++) {
                var f = flags[i], exp = explanations[f.key], reason = getExplanation(f.key, f.pct);
                html += '<div class="analysis-card" style="border-left-color:'+exp.color+';"><strong style="color:'+exp.color+';">'+exp.title+' — '+f.pct+'%</strong><p style="margin-top:0.2rem;">'+reason+'</p></div>';
            }
            html += '</div>';
            html += '<button class="btn" id="retakeBtn">🔄 Retake Honestly</button>';
            html += '<div class="share-btns"><button class="btn btn-outline" id="copyBtn">📋 Copy</button><button class="btn btn-outline" id="waBtn">📱 WA</button><button class="btn btn-outline" id="twBtn">🐦 Tweet</button></div></div>';
            quizArea.innerHTML = html;

            document.getElementById('retakeBtn').addEventListener('click', function() {
                currentIdx=0; scores={r:0,g:0,w:0,d:0};
                midAd.classList.add('hidden'); bottomAd.classList.add('hidden');
                renderQuestion();
            });

            var shareText = '🚩 My Flag: '+combo.name+' | Red:'+p.r+'% Green:'+p.g+'% White:'+p.w+'% Dark:'+p.d+'% | Confidence:'+confidence+'% | Try: '+window.location.href;
            document.getElementById('copyBtn').addEventListener('click', function(){ navigator.clipboard.writeText(shareText).then(function(){ alert('Copied!'); }); });
            document.getElementById('waBtn').addEventListener('click', function(){ window.open('https://wa.me/?text='+encodeURIComponent(shareText)); });
            document.getElementById('twBtn').addEventListener('click', function(){ window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(shareText)); });
        }

        renderQuestion();
    </script>
</body>
</html>
